<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giulia & Andrea - 18 Luglio 2026</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Giulia & Andrea</h1>
    <p>Ci sposiamo il 18 Luglio 2026 alle ore 16:00 a Pienza</p>
  </header>

  <section id="countdown">
    <h2>Countdown al grande giorno</h2>
    <div id="timer">Caricamento...</div>
  </section>

  <section id="rsvp">
    <h2>Conferma la tua presenza</h2>
    <form id="rsvp-form">
      <label>Nome e Cognome:<br>
        <input type="text" name="name" required />
      </label><br>

      <label>Parteciperai?<br>
        <select name="attendance" required>
          <option value="">Seleziona</option>
          <option value="Sì">Sì</option>
          <option value="No">No</option>
        </select>
      </label><br>

      <label>Allergie o intolleranze?<br>
        <input type="text" name="allergies" />
      </label><br>

      <label>Note:<br>
        <textarea name="notes"></textarea>
      </label><br>

      <button type="submit">Invia RSVP</button>
    </form>
    <div id="form-status"></div>
  </section>

  <section id="accommodation">
    <h2>Alloggi Consigliati</h2>
    <p>Presto aggiungeremo una lista di strutture dove soggiornare nei dintorni di Pienza.</p>
  </section>

  <footer>
    <p>Con amore, Giulia & Andrea</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
